services:
  - type: web
    name: ai-github-reviewer-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GITHUB_TOKEN
        sync: false          # set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./github_reviewer.db
      - key: MAX_FILE_SIZE_KB
        value: "150"
      - key: MAX_FILES_TO_ANALYZE
        value: "20"
      - key: CORS_ORIGINS
        value: "https://your-vercel-app.vercel.app"
    healthCheckPath: /health
